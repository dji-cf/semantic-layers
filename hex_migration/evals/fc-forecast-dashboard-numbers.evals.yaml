# Numbers-first variant of fc-forecast-dashboard.evals.yaml (same prompts, verbatim).
# Grades the figures, not the shape of the answer: each case is gated by numeric_value rubrics on the headline
# numbers the question asks for (SQL targets, strictHeadline: false so the number can appear anywhere), plus one
# judge_final_answer (numbers_accurate) that fails only on wrong or internally inconsistent figures - never on missing
# breakdowns, layout or wording. Secondary figures are warnOnly. All numeric rubrics roll up into measure number-accuracy.
# Omitted: q16 and q19 (FC_PRODUCT_SKU_V cases; errored because SVC_HEX lacks USAGE on ORACLE_DATA_PROD.FCT_CMN).
# Dollar targets are in whole dollars (the grader normalizes "$5.56B" to 5560000000), so SQL $M values are x1,000,000.
# Tolerances: $ within 1% or $0.5M; % within 1% or 0.5 pts (answers often round to whole %); bps within 2% or 3 bps.
# Generated by a script from the original suite; FY26 is hard-coded as fiscal_year = 2026 (update at year end).
name: FC Forecast Dashboard sample questions (numbers)
id: fc-forecast-dashboard-numbers
cases:
- id: q01-fy-revenue-ebitda-margin-vs-pfc
  prompt: What is our FY26 revenue, EBITDA and EBITDA margin in the latest forecast, and how did they change versus the prior forecast?
  attempts: 1
  rubrics:
  - id: fy_revenue
    type: numeric_value
    target:
      sql: |
        SELECT ROUND(v * 1000000) FROM (
        SELECT revenue FROM (
        SELECT version_label, pfc_version_label,
               ROUND(SUM(net_revenue), 2) AS revenue, ROUND(SUM(pfc_net_revenue), 2) AS pfc_revenue,
               ROUND(SUM(net_revenue) - SUM(pfc_net_revenue), 2) AS revenue_vs_pfc,
               ROUND(100 * (SUM(net_revenue) - SUM(pfc_net_revenue)) / NULLIF(SUM(pfc_net_revenue), 0), 2) AS revenue_vs_pfc_pct,
               ROUND(SUM(adj_ebitda), 2) AS adj_ebitda, ROUND(SUM(pfc_adj_ebitda), 2) AS pfc_adj_ebitda,
               ROUND(SUM(adj_ebitda) - SUM(pfc_adj_ebitda), 2) AS ebitda_vs_pfc,
               ROUND(100 * SUM(adj_ebitda) / NULLIF(SUM(net_revenue), 0), 2) AS ebitda_margin_pct,
               ROUND(100 * SUM(pfc_adj_ebitda) / NULLIF(SUM(pfc_net_revenue), 0), 2) AS pfc_ebitda_margin_pct,
               ROUND((SUM(adj_ebitda) / NULLIF(SUM(net_revenue), 0) - SUM(pfc_adj_ebitda) / NULLIF(SUM(pfc_net_revenue), 0)) * 10000, 2) AS ebitda_margin_bps_vs_pfc
        FROM ORACLE_DATA_PROD.SANDBOX.FC_SEGMENT_PL_V
        WHERE is_latest_fc = TRUE AND fiscal_year = 2026
        GROUP BY version_label, pfc_version_label
        ) t
        ) s (v)
      dataConnectionId: 01a11848-a092-7729-a954-c8db37991b8b
      timeoutSeconds: 60
    tolerancePercentage: 1
    absoluteTolerance: 500000
    strictHeadline: false
    extractionGuidance: FY26 net revenue in the latest forecast. Always report in whole US dollars, never $M or $B ($46.6M = 46600000; $1.59B = 1590000000). Decreases are negative.
    measure: number-accuracy
  - id: fy_adj_ebitda
    type: numeric_value
