- id: q02-revenue-by-segment-vs-aug
  prompt: Which segments drove the +3% increase in FY26 revenue versus the Aug forecast?
  attempts: 1
  rubrics:
  - id: total_revenue_vs_aug
    type: numeric_value
    target:
      sql: |
        SELECT ROUND(v * 1000000) FROM (
        SELECT ROUND(SUM(revenue_vs_comparison), 2) FROM (
        SELECT revenue_segment,
               MAX(IFF(is_latest_fc, version_label, NULL)) AS version_label,
               MAX(IFF(version_code = 'AUG26RF', version_label, NULL)) AS comparison_version_label,
               ROUND(SUM(IFF(is_latest_fc, net_revenue, 0)), 2) AS revenue,
               ROUND(SUM(IFF(version_code = 'AUG26RF', net_revenue, 0)), 2) AS comparison_revenue,
               ROUND(SUM(IFF(is_latest_fc, net_revenue, 0)) - SUM(IFF(version_code = 'AUG26RF', net_revenue, 0)), 2) AS revenue_vs_comparison,
               ROUND(100 * (SUM(IFF(is_latest_fc, net_revenue, 0)) - SUM(IFF(version_code = 'AUG26RF', net_revenue, 0)))
                     / NULLIF(SUM(IFF(version_code = 'AUG26RF', net_revenue, 0)), 0), 2) AS revenue_vs_comparison_pct
        FROM ORACLE_DATA_PROD.SANDBOX.FC_SEGMENT_PL_V
        WHERE (is_latest_fc = TRUE OR version_code = 'AUG26RF') AND fiscal_year = 2026
        GROUP BY revenue_segment
        HAVING SUM(net_revenue) <> 0
        ORDER BY revenue_vs_comparison DESC
        ) t
        ) s (v)
      dataConnectionId: 01a11848-a092-7729-a954-c8db37991b8b
      timeoutSeconds: 60
    tolerancePercentage: 1
    absoluteTolerance: 500000
    strictHeadline: false
    extractionGuidance: Total FY26 revenue change, latest forecast vs Aug 2026 FC. Always report in whole US dollars, never $M or $B ($46.6M = 46600000; $1.59B = 1590000000). Decreases are negative.
    measure: number-accuracy
  - id: total_revenue_vs_aug_pct
    type: numeric_value
    target:
      sql: |
        SELECT ROUND(100 * (SUM(IFF(is_latest_fc, net_revenue, 0)) - SUM(IFF(version_code = 'AUG26RF', net_revenue, 0))) / NULLIF(SUM(IFF(version_code = 'AUG26RF', net_revenue, 0)), 0), 2)
        FROM ORACLE_DATA_PROD.SANDBOX.FC_SEGMENT_PL_V
        WHERE (is_latest_fc = TRUE OR version_code = 'AUG26RF') AND fiscal_year = 2026
      dataConnectionId: 01a11848-a092-7729-a954-c8db37991b8b
      timeoutSeconds: 60
    tolerancePercentage: 1
    absoluteTolerance: 0.5
    strictHeadline: false
    extractionGuidance: Total FY26 revenue % change, latest forecast vs Aug 2026 FC. Value as a percent number (12.7% = 12.7). Decreases are negative.
    measure: number-accuracy
  - id: top_segment_driver
    type: numeric_value
    target:
      sql: |
        SELECT ROUND(v * 1000000) FROM (
        SELECT revenue_vs_comparison FROM (
        SELECT revenue_segment,
               MAX(IFF(is_latest_fc, version_label, NULL)) AS version_label,
               MAX(IFF(version_code = 'AUG26RF', version_label, NULL)) AS comparison_version_label,
               ROUND(SUM(IFF(is_latest_fc, net_revenue, 0)), 2) AS revenue,
               ROUND(SUM(IFF(version_code = 'AUG26RF', net_revenue, 0)), 2) AS comparison_revenue,
               ROUND(SUM(IFF(is_latest_fc, net_revenue, 0)) - SUM(IFF(version_code = 'AUG26RF', net_revenue, 0)), 2) AS revenue_vs_comparison,
               ROUND(100 * (SUM(IFF(is_latest_fc, net_revenue, 0)) - SUM(IFF(version_code = 'AUG26RF', net_revenue, 0)))
                     / NULLIF(SUM(IFF(version_code = 'AUG26RF', net_revenue, 0)), 0), 2) AS revenue_vs_comparison_pct
        FROM ORACLE_DATA_PROD.SANDBOX.FC_SEGMENT_PL_V
        WHERE (is_latest_fc = TRUE OR version_code = 'AUG26RF') AND fiscal_year = 2026
        GROUP BY revenue_segment
        HAVING SUM(net_revenue) <> 0
        ORDER BY revenue_vs_comparison DESC
        ) t
        ORDER BY ABS(revenue_vs_comparison) DESC LIMIT 1
        ) s (v)
      dataConnectionId: 01a11848-a092-7729-a954-c8db37991b8b
      timeoutSeconds: 60
    tolerancePercentage: 1
    absoluteTolerance: 500000
    strictHeadline: false
    extractionGuidance: Revenue change vs Aug of the largest segment driver. Always report in whole US dollars, never $M or $B ($46.6M = 46600000; $1.59B = 1590000000). Decreases are negative.
    measure: number-accuracy
  - id: numbers_accurate
    type: judge_final_answer
    criterion: Judge only the numbers. Is every figure the answer states for this question consistent with the expected SQL result within rounding (a figure rounded to the precision it is stated at counts
      as correct, e.g. 838.2995 stated as 838.2M or 838M; allow $B/$M, % / bps and sign-wording conversions), and is the arithmetic between stated figures correct (e.g. a % change matches its $ values)?
      Do NOT fail for missing breakdowns, extra context, layout, chart vs table, wording or labels. Figures the expected SQL does not cover count against the answer only if they contradict it or are internally
      inconsistent.
    expectedSql:
      sql: |
        SELECT revenue_segment,
               MAX(IFF(is_latest_fc, version_label, NULL)) AS version_label,
               MAX(IFF(version_code = 'AUG26RF', version_label, NULL)) AS comparison_version_label,
               ROUND(SUM(IFF(is_latest_fc, net_revenue, 0)), 2) AS revenue,
               ROUND(SUM(IFF(version_code = 'AUG26RF', net_revenue, 0)), 2) AS comparison_revenue,
               ROUND(SUM(IFF(is_latest_fc, net_revenue, 0)) - SUM(IFF(version_code = 'AUG26RF', net_revenue, 0)), 2) AS revenue_vs_comparison,
               ROUND(100 * (SUM(IFF(is_latest_fc, net_revenue, 0)) - SUM(IFF(version_code = 'AUG26RF', net_revenue, 0)))
                     / NULLIF(SUM(IFF(version_code = 'AUG26RF', net_revenue, 0)), 0), 2) AS revenue_vs_comparison_pct
        FROM ORACLE_DATA_PROD.SANDBOX.FC_SEGMENT_PL_V
        WHERE (is_latest_fc = TRUE OR version_code = 'AUG26RF') AND fiscal_year = 2026
        GROUP BY revenue_segment
        HAVING SUM(net_revenue) <> 0
        ORDER BY revenue_vs_comparison DESC
      dataConnectionId: 01a11848-a092-7729-a954-c8db37991b8b
    measure: number-accuracy
- id: q03-ytd-actual-vs-forecast-by-segment
  prompt: How much of FY26 revenue is already actual (YTD through Aug) versus still forecast, by segment?
  attempts: 1
  rubrics:
  - id: total_actual_revenue
