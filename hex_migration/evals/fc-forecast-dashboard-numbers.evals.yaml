    extractionGuidance: Total FY26 revenue still in forecast. Always report in whole US dollars, never $M or $B ($46.6M = 46600000; $1.59B = 1590000000). Decreases are negative.
    measure: number-accuracy
  - id: total_pct_actual
    type: numeric_value
    target:
      sql: |
        SELECT ROUND(100 * SUM(actual_ytd_revenue) / NULLIF(SUM(fy_revenue), 0), 2) FROM (
        SELECT MAX(version_label) AS version_label, MAX(actuals_through_date) AS actuals_through_date, revenue_segment,
               ROUND(SUM(IFF(af_flag = 'A', net_revenue, 0)), 2) AS actual_ytd_revenue,
