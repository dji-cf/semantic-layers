- id: q13-true-up-vs-reforecast-vs-aug
  prompt: Of the change versus Aug, how much comes from closed months being trued up to actuals, and how much from changes to months still in forecast?
  attempts: 1
  rubrics:
  - id: true_up_revenue
    type: numeric_value
    target:
      sql: |
        SELECT ROUND(v * 1000000) FROM (
        SELECT revenue_vs_comparison FROM (
        WITH m AS (
          SELECT month_number,
                 MAX(IFF(is_latest_fc, version_label, NULL)) AS version_label,
                 MAX(IFF(version_code = 'AUG26RF', version_label, NULL)) AS comparison_version_label,
                 MAX(IFF(is_latest_fc, af_flag, NULL)) AS af_now,
                 MAX(IFF(version_code = 'AUG26RF', af_flag, NULL)) AS af_aug,
                 SUM(IFF(is_latest_fc, net_revenue, 0)) - SUM(IFF(version_code = 'AUG26RF', net_revenue, 0)) AS revenue_delta,
                 SUM(IFF(is_latest_fc, adj_ebitda, 0)) - SUM(IFF(version_code = 'AUG26RF', adj_ebitda, 0)) AS ebitda_delta
          FROM ORACLE_DATA_PROD.SANDBOX.FC_SEGMENT_PL_V
          WHERE (is_latest_fc = TRUE OR version_code = 'AUG26RF') AND fiscal_year = 2026
          GROUP BY month_number)
        SELECT CASE WHEN af_aug = 'A' AND af_now = 'A' THEN 'Actual in both'
                    WHEN af_aug = 'F' AND af_now = 'A' THEN 'Closed since Aug FC (true-up)'
                    ELSE 'Forecast in both (re-forecast)' END AS bucket,
               MAX(version_label) AS version_label, MAX(comparison_version_label) AS comparison_version_label,
               LISTAGG(month_number, ',') WITHIN GROUP (ORDER BY month_number) AS months,
               ROUND(SUM(revenue_delta), 2) AS revenue_vs_comparison,
               ROUND(SUM(ebitda_delta), 2) AS ebitda_vs_comparison
        FROM m
        GROUP BY 1
        ORDER BY MIN(month_number)
        ) t
        WHERE bucket = 'Closed since Aug FC (true-up)'
        ) s (v)
      dataConnectionId: 01a11848-a092-7729-a954-c8db37991b8b
      timeoutSeconds: 60
