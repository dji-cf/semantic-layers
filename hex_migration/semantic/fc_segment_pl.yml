type: model
id: fc_segment_pl
name: FC Segment P&L
description: |-
  Fanatics Collectibles management P&L (Revenue -> Gross Margin -> Contribution Margin -> Adj. EBITDA) by forecast version, fiscal month and management segment, for Actual, Budget (Plan_<year>) and every Monthly Forecast cycle (<MON><YY>RF). Reproduces the Monthly Forecast deck.
  Grain: one row per version_code x fiscal month (period_date) x leaf sub_segment. All amounts are USD millions ($M); fiscal year = calendar year. Each row also carries prior forecast (pfc_*), Budget (budget_*) and prior-year actual (py_*) values for the same month and segment, so variances need no joins.
  CRITICAL: filter to exactly ONE version (or compare versions explicitly by grouping/pivoting on version_label) and to ONE fiscal_year; forecasts include preliminary next-year months. Which cycle is latest is data-driven (is_latest_fc); never assume a month. Totals are SUM over segments; there are no total rows.
base_sql_table: ORACLE_DATA_PROD.SANDBOX.FC_SEGMENT_PL_V
dimensions:
- id: row_key
  type: string
  unique: true
  visibility: internal
  expr_sql: VERSION_CODE || '|' || TO_VARCHAR(PERIOD_DATE) || '|' || SUB_SEGMENT
  description: 'Row grain key: version_code | period_date | sub_segment. Verified unique.'
- id: version_code
  type: string
  expr_sql: VERSION_CODE
  description: |-
    Planning version code. 'Actual' = booked actuals; 'Plan_<year>' = that year's Budget; '<MON><YY>RF' = Monthly Forecast for that cycle month (e.g. <MON><YY>RF = the <Mon> 20<YY> Forecast). Always filter to one, except when comparing versions explicitly (group or pivot by version_label). Which cycle is latest is data-driven: use is_latest_fc, never assume a month.
    Values: Actual, Plan_<year>, <MON><YY>RF.
    Synonyms: version, scenario, forecast version, forecast cycle, cycle
- id: version_label
  type: string
  expr_sql: VERSION_LABEL
  description: |-
    Display label, e.g. '<Mon> <YYYY> FC', 'Budget <YYYY>', 'Actual'. Return it with every version-based figure.
    Synonyms: forecast name, FC name
- id: version_type
  type: string
  expr_sql: VERSION_TYPE
  description: |-
    Actual / Budget / Monthly Forecast.
    Values: Actual, Budget, Monthly Forecast.
    Synonyms: scenario type
- id: pfc_version_code
  type: string
  expr_sql: PFC_VERSION_CODE
  description: |-
    Version code of the cycle immediately before this Monthly Forecast (e.g. <MON><YY>RF -> the prior month's <MON><YY>RF). The pfc_* columns hold its values. Use pfc_* ONLY for 'prior forecast' / 'PFC' / 'last month' comparisons, never for a named cycle.
    Synonyms: prior forecast version, PFC version, prior FC
- id: pfc_version_label
  type: string
  expr_sql: PFC_VERSION_LABEL
  description: |-
    Display label of the prior forecast cycle (the cycle the pfc_* facts come from).
    Synonyms: prior forecast name
- id: latest_fc_label
  type: string
  expr_sql: LATEST_FC_LABEL
  description: |-
    Label of the newest loaded Monthly Forecast in this dataset (same value on every row).
    Synonyms: latest forecast name, current forecast label
- id: is_latest_fc
  type: boolean
  expr_sql: IS_LATEST_FC
  description: |-
    TRUE only for the most recent Monthly Forecast cycle. Use for 'latest forecast' questions.
    Synonyms: latest forecast, current forecast, most recent forecast, this forecast
- id: is_prior_fc
  type: boolean
  expr_sql: IS_PRIOR_FC
  description: |-
    TRUE only for the Monthly Forecast immediately before the latest one.
    Synonyms: previous forecast, last month's forecast
- id: fiscal_year
  type: number
  expr_sql: FISCAL_YEAR
  description: |-
    Fiscal year (= calendar year), e.g. 2026. FY26 = 2026.
    Synonyms: FY, year
- id: fiscal_quarter
  type: string
  expr_sql: FISCAL_QUARTER
  description: |-
    Q1 (Jan-Mar), Q2 (Apr-Jun), Q3 (Jul-Sep), Q4 (Oct-Dec).
    Values: Q1, Q2, Q3, Q4.
    Synonyms: quarter, qtr
- id: fiscal_half
  type: string
  expr_sql: FISCAL_HALF
  description: |-
    H1 (Jan-Jun) or H2 (Jul-Dec).
    Values: H1, H2.
    Synonyms: half, H1, H2
- id: month_number
  type: number
  expr_sql: MONTH_NUMBER
  description: |-
    Calendar month number 1-12.
    Synonyms: month number
- id: month_name
  type: string
  expr_sql: MONTH_NAME
  description: |-
    Three-letter month, e.g. JAN, SEP. Order by month_number.
    Values: JAN, FEB, MAR, APR, MAY, JUN, JUL, AUG, SEP, OCT, NOV, DEC.
    Synonyms: month
- id: af_flag
  type: string
  expr_sql: AF_FLAG
  description: |-
    'A' if the month is on or before the version's actuals-through date (booked actual inside the forecast), 'F' if still forecast, 'Plan' for Budget. A total spanning A and F months is Forecast.
    Values: A, F, Plan.
    Synonyms: actual or forecast, A/F, actualized, closed month, is actual
- id: af_transition_vs_pfc
  type: string
  expr_sql: AF_TRANSITION_VS_PFC
  description: |-
    For Monthly Forecasts: 'Actual in both' (closed before the PFC), 'Closed since PFC' (forecast in the PFC, now actual -> change is a true-up to actuals), 'Forecast in both' (change is a re-forecast).
    Values: Actual in both, Closed since PFC, Forecast in both.
    Synonyms: true-up, closed since prior forecast, actualized since PFC
- id: sub_segment
  type: string
  expr_sql: SUB_SEGMENT
  description: |-
    Leaf management unit. North America = Topps Domestic + GCP Manufacturing + GCP Intercompany Eliminations; International = Topps International + International Intercompany Eliminations; Fanatics Collect = Fanatics Live (incl. Instant Rips) + Marketplace.
    Values: Topps Domestic, GCP Manufacturing, GCP Intercompany Eliminations, Topps International, International Intercompany Eliminations, Topps Eliminations, Digital, Corporate OH, Fanatics Live (incl. Instant Rips), Marketplace, Key Litigation, TCG.
    Synonyms: sub-segment, business unit, LOB, line of business
- id: segment
  type: string
  expr_sql: SEGMENT
  description: |-
    Deck segment for EBITDA / cost exhibits (Eliminations shown as its own row). Use for EBITDA, SG&A, gross-margin-by-segment and margin questions. 'North America' here EXCLUDES Topps Eliminations.
    Values: North America, International, Eliminations, Digital, Corporate, Fanatics Collect, Key Litigation, TCG.
    Synonyms: management segment, division, EBITDA segment
- id: revenue_segment
  type: string
  expr_sql: REVENUE_SEGMENT
  description: |-
    Deck segment for REVENUE exhibits: North America is shown net of eliminations (Topps Eliminations folded into North America). Use for any revenue-by-segment or revenue-mix question.
    Values: North America, International, Digital, Fanatics Collect, Corporate, Key Litigation, TCG.
    Synonyms: revenue segment, sales segment
- id: weekly_segment
  type: string
  expr_sql: WEEKLY_SEGMENT
  description: |-
    Weekly Finance Update grouping; Other = Corporate + Key Litigation + TCG; North America net of eliminations.
    Values: North America, International, Digital, Fanatics Collect, Other.
    Synonyms: weekly segment
- id: segment_group
  type: string
  expr_sql: SEGMENT_GROUP
  description: |-
    'Total Physical Cards' = North America + International + Eliminations. Others: Digital, Corporate, Emerging Services (Fanatics Collect, Key Litigation, TCG).
    Values: Total Physical Cards, Digital, Corporate, Emerging Services.
    Synonyms: segment group, physical cards
- id: is_emerging_services
  type: boolean
  expr_sql: IS_EMERGING_SERVICES
  description: |-
    TRUE for Emerging Services (Fanatics Collect, Key Litigation, TCG). 'Total ex-Emerging Services' = is_emerging_services = FALSE.
    Synonyms: ES, emerging services, excl. ES, ex-ES
- id: gaap_business_unit
  type: string
  expr_sql: GAAP_BUSINESS_UNIT
  description: |-
    GAAP Financial Statement package business unit label for the sub-segment.
    Synonyms: GAAP BU, business unit (GAAP)
- id: segment_sort
  type: number
  expr_sql: SEGMENT_SORT
  visibility: internal
  description: Deck display order of the sub-segment; ORDER BY MIN(segment_sort) to list segments in deck order.
- id: bu_page
  type: string
  expr_sql: BU_PAGE
  description: |-
    Drillable P&L BU drill-down page: North America (Topps Domestic + GCP Manufacturing + GCP Intercompany Eliminations, PLUS Topps Eliminations in Net Sales only), International, Digital, Fanatics Collect. NULL for Corporate, Key Litigation and TCG (no BU page). Under a bu_page filter, SUM(net_revenue) is the page's Net Sales (for North America it INCLUDES Topps Eliminations) while every bu_* fact excludes Topps Eliminations -- so NA BU Net Sales = revenue_segment North America, and NA BU EBITDA = segment North America.
    Values: North America, International, Digital, Fanatics Collect.
    Synonyms: BU, BU page, BU P&L, business unit P&L, drill-down, drillable P&L
- id: bu_detail
  type: string
  expr_sql: BU_DETAIL
  description: |-
    Line block within a BU page. North America splits into 'NASE' (Topps Domestic, LB_302, plus Topps Eliminations in Net Sales only) and 'GCP' (GCP Manufacturing + GCP Intercompany Eliminations, the card printer; its revenue nets to about zero, so never report a GCP % or margin). Other pages: = bu_page.
    Values: NASE, GCP, International, Digital, Fanatics Collect.
    Synonyms: BU line, NASE or GCP, North America excl GCP
- id: in_bu_basis
  type: boolean
  expr_sql: IN_BU_BASIS
  visibility: internal
  description: |-
    TRUE if the row counts in BU COGS / gross margin / marketing / SG&A / EBITDA. FALSE only for Topps Eliminations (North America page Net Sales only). NULL for sub-segments with no BU page. The bu_* facts already apply it; do not filter on it when computing BU Net Sales.
    Synonyms: BU basis
- id: period_date
  type: date
  expr_sql: PERIOD_DATE
  description: |-
    First day of the fiscal month.
    Synonyms: month start, period, date
- id: cycle_month
  type: date
  expr_sql: CYCLE_MONTH
  description: |-
    Month the Monthly Forecast was prepared for (<MON><YY>RF -> first day of that month). Use to order forecast versions chronologically.
    Synonyms: forecast cycle month, forecast date
- id: actuals_through_date
  type: date
  expr_sql: ACTUALS_THROUGH_DATE
  description: |-
    Last day of the last closed (actual) month inside this version (for a <MON><YY>RF cycle: the last day of the month before the cycle month).
    Synonyms: actuals through, as of
- id: net_revenue
  type: number
  visibility: internal
  expr_sql: NET_REVENUE
  description: |-
    Net revenue ($M).
    Synonyms: revenue, net sales, sales, top line
- id: manufacturing
  type: number
  visibility: internal
  expr_sql: MANUFACTURING
  description: |-
    Manufacturing costs in COGS ($M).
    Synonyms: manufacturing cost, production cost
- id: royalties
  type: number
  visibility: internal
  expr_sql: ROYALTIES
  description: |-
    Royalties paid to licensors, in COGS ($M).
    Synonyms: royalty, license fees
- id: autos_relics
  type: number
  visibility: internal
  expr_sql: AUTOS_RELICS
  description: |-
    Autograph & Relic costs, in COGS ($M).
    Synonyms: autograph and relic, A&R, autos
- id: product_development
  type: number
  visibility: internal
  expr_sql: PRODUCT_DEVELOPMENT
  description: |-
    Product development / other product costs, in COGS ($M).
    Synonyms: other product costs, product dev, photography, creative
- id: net_freight
  type: number
  visibility: internal
  expr_sql: NET_FREIGHT
  description: |-
    Net freight expense, in COGS ($M).
    Synonyms: freight, shipping
- id: mg_shortfall
  type: number
  visibility: internal
  expr_sql: MG_SHORTFALL
  description: |-
    Minimum-guarantee royalty shortfall, in COGS ($M).
    Synonyms: minimum guarantee shortfall, MG
- id: obsolescence
  type: number
  visibility: internal
  expr_sql: OBSOLESCENCE
  description: |-
    Inventory obsolescence, in COGS ($M).
    Synonyms: inventory obsolescence, write-down
- id: cogs_compensation
  type: number
  visibility: internal
  expr_sql: COGS_COMPENSATION
  description: |-
    Compensation charged to COGS (mostly GCP labor) ($M).
    Synonyms: COGS labor, manufacturing labor
- id: cogs
  type: number
  visibility: internal
  expr_sql: COGS
  description: |-
    Total COGS = manufacturing + royalties + autos_relics + product_development + net_freight + mg_shortfall + obsolescence + cogs_compensation ($M).
    Synonyms: cost of goods sold, cost of sales, product costs
- id: gross_margin
  type: number
  visibility: internal
  expr_sql: GROSS_MARGIN
  description: |-
    Gross margin = net_revenue - cogs ($M).
    Synonyms: GM, gross profit
- id: marketing
  type: number
  visibility: internal
  expr_sql: MARKETING
  description: |-
    Marketing / advertising ($M); sits above contribution margin.
    Synonyms: advertising, marketing spend
- id: contribution_margin
  type: number
  visibility: internal
  expr_sql: CONTRIBUTION_MARGIN
  description: |-
    Contribution margin = gross_margin - marketing ($M).
    Synonyms: CM
- id: other_sga
  type: number
  visibility: internal
  expr_sql: OTHER_SGA
  description: |-
    SG&A excluding marketing (salaries, bonus, professional services, legal, allocations, etc.) ($M). For Key Litigation this is the litigation cost.
    Synonyms: SG&A excl marketing, operating expenses, opex, overhead
- id: sga_total
  type: number
  visibility: internal
  expr_sql: SGA_TOTAL
  description: |-
    Total SG&A including marketing and key litigation = marketing + other_sga ($M). Deck SG&A Total.
    Synonyms: total SG&A, SG&A incl marketing
- id: adj_ebitda
  type: number
  visibility: internal
  expr_sql: ADJ_EBITDA
  description: |-
    Adjusted EBITDA = contribution_margin - other_sga ($M). Total across all segments = Adj. EBITDA incl. Emerging Services (default 'EBITDA').
    Synonyms: EBITDA, adjusted EBITDA, AEBITDA, profit
- id: pfc_net_revenue
  type: number
  visibility: internal
  expr_sql: PFC_NET_REVENUE
  description: |-
    Net revenue in the cycle immediately before this version (pfc_version_label) for the same month/segment ($M). Not for named-cycle comparisons.
    Synonyms: prior forecast revenue, PFC revenue, last month's forecast revenue
- id: pfc_manufacturing
  type: number
  visibility: internal
  expr_sql: PFC_MANUFACTURING
  description: PFC manufacturing ($M).
- id: pfc_royalties
  type: number
  visibility: internal
  expr_sql: PFC_ROYALTIES
  description: PFC royalties ($M).
- id: pfc_autos_relics
  type: number
  visibility: internal
  expr_sql: PFC_AUTOS_RELICS
  description: PFC autograph & relic costs ($M).
- id: pfc_product_development
  type: number
  visibility: internal
  expr_sql: PFC_PRODUCT_DEVELOPMENT
  description: PFC product development ($M).
- id: pfc_net_freight
  type: number
  visibility: internal
  expr_sql: PFC_NET_FREIGHT
  description: PFC net freight ($M).
- id: pfc_cogs_compensation
  type: number
  visibility: internal
  expr_sql: PFC_COGS_COMPENSATION
  description: PFC COGS compensation ($M).
- id: pfc_cogs
  type: number
  visibility: internal
  expr_sql: PFC_COGS
  description: PFC total COGS ($M).
- id: pfc_gross_margin
  type: number
  visibility: internal
  expr_sql: PFC_GROSS_MARGIN
  description: |-
    PFC gross margin ($M).
    Synonyms: prior forecast gross margin
- id: pfc_marketing
  type: number
  visibility: internal
  expr_sql: PFC_MARKETING
  description: PFC marketing ($M).
- id: pfc_contribution_margin
  type: number
  visibility: internal
  expr_sql: PFC_CONTRIBUTION_MARGIN
  description: PFC contribution margin ($M).
- id: pfc_other_sga
  type: number
  visibility: internal
  expr_sql: PFC_OTHER_SGA
  description: PFC SG&A excl. marketing ($M).
- id: pfc_adj_ebitda
  type: number
  visibility: internal
  expr_sql: PFC_ADJ_EBITDA
  description: |-
    PFC Adj. EBITDA ($M).
    Synonyms: prior forecast EBITDA, PFC EBITDA
- id: budget_net_revenue
  type: number
  visibility: internal
  expr_sql: BUDGET_NET_REVENUE
  description: |-
    Budget (Plan_<fiscal_year>) net revenue for the same month/segment ($M). Zero where no budget exists (FY27+).
    Synonyms: budget revenue, plan revenue
- id: budget_gross_margin
  type: number
  visibility: internal
  expr_sql: BUDGET_GROSS_MARGIN
  description: |-
    Budget gross margin ($M).
    Synonyms: budget GM
- id: budget_marketing
  type: number
  visibility: internal
  expr_sql: BUDGET_MARKETING
  description: Budget marketing ($M).
- id: budget_contribution_margin
  type: number
  visibility: internal
  expr_sql: BUDGET_CONTRIBUTION_MARGIN
  description: |-
    Budget contribution margin ($M).
    Synonyms: budget CM
- id: budget_other_sga
  type: number
  visibility: internal
  expr_sql: BUDGET_OTHER_SGA
  description: Budget SG&A excl. marketing ($M).
- id: budget_adj_ebitda
  type: number
  visibility: internal
  expr_sql: BUDGET_ADJ_EBITDA
  description: |-
    Budget Adj. EBITDA ($M).
    Synonyms: budget EBITDA, plan EBITDA
- id: py_net_revenue
  type: number
  visibility: internal
  expr_sql: PY_NET_REVENUE
  description: |-
    Prior-year ACTUAL net revenue for the same month/segment ($M).
    Synonyms: prior year revenue, last year revenue, PY revenue
- id: py_gross_margin
  type: number
  visibility: internal
  expr_sql: PY_GROSS_MARGIN
  description: Prior-year actual gross margin ($M).
- id: py_marketing
  type: number
  visibility: internal
  expr_sql: PY_MARKETING
  description: Prior-year actual marketing ($M).
- id: py_contribution_margin
  type: number
  visibility: internal
  expr_sql: PY_CONTRIBUTION_MARGIN
  description: Prior-year actual contribution margin ($M).
- id: py_other_sga
  type: number
  visibility: internal
  expr_sql: PY_OTHER_SGA
  description: Prior-year actual SG&A excl. marketing ($M).
- id: py_adj_ebitda
  type: number
  visibility: internal
  expr_sql: PY_ADJ_EBITDA
  description: |-
    Prior-year actual Adj. EBITDA ($M).
    Synonyms: prior year EBITDA, last year EBITDA
- id: bu_gross_revenue
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, NET_REVENUE, 0)
  description: |-
    BU-basis net revenue, excl. Topps Eliminations ($M). Under bu_detail = 'NASE' this is Gross Revenue (NASE); BU Net Sales is SUM(net_revenue), not this.
    Synonyms: BU gross revenue, NASE gross revenue
- id: bu_cogs
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, COGS, 0)
  description: |-
    BU-basis total COGS, excl. Topps Eliminations ($M).
    Synonyms: BU COGS, NASE COGS, GCP COGS
- id: bu_std_mfg
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, MANUFACTURING, 0)
  description: |-
    BU-basis Standard Manufacturing COGS bucket = manufacturing ($M).
    Synonyms: standard manufacturing, std mfg
- id: bu_royalties
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, ROYALTIES, 0)
  description: |-
    BU-basis Royalties COGS bucket ($M).
    Synonyms: BU royalties
- id: bu_mg_shortfall
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, MG_SHORTFALL, 0)
  description: |-
    BU-basis MG Shortfalls COGS bucket ($M).
    Synonyms: BU MG shortfalls, MG shortfalls
- id: bu_autos_relics
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, AUTOS_RELICS, 0)
  description: |-
    BU-basis Autos & Relics COGS bucket ($M).
    Synonyms: BU autos and relics
- id: bu_other_cogs
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, NET_FREIGHT + PRODUCT_DEVELOPMENT + OBSOLESCENCE + COGS_COMPENSATION, 0)
  description: |-
    BU-basis Other COGS bucket = net_freight + product_development + obsolescence + cogs_compensation ($M).
    Synonyms: other COGS, other COGS bucket
- id: bu_gross_margin
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, GROSS_MARGIN, 0)
  description: |-
    BU-basis gross margin / Gross Profit, excl. Topps Eliminations ($M).
    Synonyms: BU gross profit, NASE gross profit
- id: bu_marketing
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, MARKETING, 0)
  description: |-
    BU-basis marketing ($M). GCP carries none.
    Synonyms: BU marketing
- id: bu_other_sga
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, OTHER_SGA, 0)
  description: |-
    BU-basis SG&A excluding marketing (= other_sga; North America excludes Key Litigation) ($M).
    Synonyms: BU SG&A, NASE SG&A, GCP SG&A, BU SG&A excl marketing
- id: bu_adj_ebitda
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, ADJ_EBITDA, 0)
  description: |-
    BU-basis Adj. EBITDA, excl. Topps Eliminations ($M). Equals adj_ebitda for segment = bu_page.
    Synonyms: BU EBITDA, NASE EBITDA, GCP EBITDA
- id: pfc_bu_gross_margin
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, PFC_GROSS_MARGIN, 0)
  description: PFC BU-basis gross margin ($M).
- id: pfc_bu_marketing
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, PFC_MARKETING, 0)
  description: PFC BU-basis marketing ($M).
- id: pfc_bu_other_sga
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, PFC_OTHER_SGA, 0)
  description: PFC BU-basis SG&A excl. marketing ($M).
- id: pfc_bu_adj_ebitda
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, PFC_ADJ_EBITDA, 0)
  description: |-
    PFC BU-basis Adj. EBITDA ($M).
    Synonyms: prior forecast BU EBITDA
- id: budget_bu_gross_margin
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, BUDGET_GROSS_MARGIN, 0)
  description: Budget BU-basis gross margin ($M).
- id: budget_bu_marketing
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, BUDGET_MARKETING, 0)
  description: Budget BU-basis marketing ($M).
- id: budget_bu_other_sga
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, BUDGET_OTHER_SGA, 0)
  description: Budget BU-basis SG&A excl. marketing ($M).
- id: budget_bu_adj_ebitda
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, BUDGET_ADJ_EBITDA, 0)
  description: |-
    Budget BU-basis Adj. EBITDA ($M).
    Synonyms: budget BU EBITDA
- id: py_bu_gross_margin
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, PY_GROSS_MARGIN, 0)
  description: Prior-year actual BU-basis gross margin ($M).
- id: py_bu_marketing
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, PY_MARKETING, 0)
  description: Prior-year actual BU-basis marketing ($M).
- id: py_bu_other_sga
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, PY_OTHER_SGA, 0)
  description: Prior-year actual BU-basis SG&A excl. marketing ($M).
- id: py_bu_adj_ebitda
  type: number
  visibility: internal
  expr_sql: IFF(IN_BU_BASIS, PY_ADJ_EBITDA, 0)
  description: |-
    Prior-year actual BU-basis Adj. EBITDA ($M).
    Synonyms: prior year BU EBITDA
measures:
- id: total_net_revenue
  func: sum
  of: net_revenue
  description: |-
    Total net revenue ($M) = SUM(net_revenue), in the selected version. Needs one version and one fiscal_year filter.
    Synonyms: revenue, net sales, sales, top line
- id: total_manufacturing
  func: sum
  of: manufacturing
