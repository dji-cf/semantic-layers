- id: total_pfc_bu_other_sga
  func: sum
  of: pfc_bu_other_sga
  description: SUM(pfc_bu_other_sga) ($M). PFC BU-basis SG&A excl. marketing ($M). Use with a bu_page filter (group by bu_detail
