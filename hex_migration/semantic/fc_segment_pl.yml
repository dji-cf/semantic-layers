    Synonyms: budget BU EBITDA
- id: total_py_bu_gross_margin
  func: sum
  of: py_bu_gross_margin
  description: SUM(py_bu_gross_margin) ($M). Prior-year actual BU-basis gross margin ($M). Use with a bu_page filter (group
    by bu_detail for NASE vs GCP).
- id: total_py_bu_marketing
  func: sum
  of: py_bu_marketing
  description: SUM(py_bu_marketing) ($M). Prior-year actual BU-basis marketing ($M). Use with a bu_page filter (group by bu_detail
    for NASE vs GCP).
- id: total_py_bu_other_sga
  func: sum
  of: py_bu_other_sga
  description: SUM(py_bu_other_sga) ($M). Prior-year actual BU-basis SG&A excl. marketing ($M). Use with a bu_page filter
    (group by bu_detail for NASE vs GCP).
- id: total_py_bu_adj_ebitda
  func: sum
  of: py_bu_adj_ebitda
  description: |-
    SUM(py_bu_adj_ebitda) ($M). Prior-year actual BU-basis Adj. EBITDA ($M). Use with a bu_page filter (group by bu_detail for NASE vs GCP).
    Synonyms: prior year BU EBITDA
- id: bu_gross_profit_pct
  func_sql: 100 * ${total_bu_gross_margin} / NULLIF(${bu_net_sales}, 0)
  description: |-
    BU Gross Profit % in percent (x100) = 100 * SUM(bu_gross_margin) / BU Net Sales (SUM(net_revenue)). North America is deliberately lower than the consolidated NA GM % (denominator includes Topps Eliminations). Never report for GCP (its revenue nets to about zero).
    Synonyms: BU gross margin %, BU GM %, gross profit %
- id: bu_ebitda_margin
  func_sql: 100 * ${total_bu_adj_ebitda} / NULLIF(${bu_net_sales}, 0)
  description: |-
    BU EBITDA margin in percent (x100) = 100 * SUM(bu_adj_ebitda) / BU Net Sales (SUM(net_revenue)). Never report for GCP (its revenue nets to about zero).
    Synonyms: BU EBITDA margin, NASE EBITDA margin
- id: bu_marketing_pct
  func_sql: 100 * ${total_bu_marketing} / NULLIF(${bu_net_sales}, 0)
  description: |-
    BU Marketing % in percent (x100) = 100 * SUM(bu_marketing) / BU Net Sales (SUM(net_revenue)). Never report for GCP (its revenue nets to about zero).
    Synonyms: BU marketing % of net sales
- id: bu_other_sga_pct
  func_sql: 100 * ${total_bu_other_sga} / NULLIF(${bu_net_sales}, 0)
  description: |-
    BU SG&A excl. marketing % in percent (x100) = 100 * SUM(bu_other_sga) / BU Net Sales (SUM(net_revenue)). Never report for GCP (its revenue nets to about zero).
    Synonyms: BU SG&A %, NASE SG&A %
- id: bu_std_mfg_pct
  func_sql: 100 * ${total_bu_std_mfg} / NULLIF(${bu_net_sales}, 0)
  description: |-
    Standard Manufacturing COGS bucket % in percent (x100) = 100 * SUM(bu_std_mfg) / BU Net Sales (SUM(net_revenue)). North America: NASE only (bu_detail = 'NASE'). Never report for GCP (its revenue nets to about zero).
    Synonyms: standard manufacturing %
- id: bu_royalties_pct
  func_sql: 100 * ${total_bu_royalties} / NULLIF(${bu_net_sales}, 0)
  description: |-
    Royalties COGS bucket % in percent (x100) = 100 * SUM(bu_royalties) / BU Net Sales (SUM(net_revenue)). North America: NASE only. Never report for GCP (its revenue nets to about zero).
    Synonyms: royalty %, royalty rate
- id: bu_mg_shortfall_pct
  func_sql: 100 * ${total_bu_mg_shortfall} / NULLIF(${bu_net_sales}, 0)
  description: |-
    MG Shortfalls COGS bucket % in percent (x100) = 100 * SUM(bu_mg_shortfall) / BU Net Sales (SUM(net_revenue)). North America: NASE only. Never report for GCP (its revenue nets to about zero).
    Synonyms: MG shortfall %
- id: bu_autos_relics_pct
  func_sql: 100 * ${total_bu_autos_relics} / NULLIF(${bu_net_sales}, 0)
  description: |-
    Autos & Relics COGS bucket % in percent (x100) = 100 * SUM(bu_autos_relics) / BU Net Sales (SUM(net_revenue)). North America: NASE only. Never report for GCP (its revenue nets to about zero).
    Synonyms: autos and relics %
- id: bu_other_cogs_pct
  func_sql: 100 * ${total_bu_other_cogs} / NULLIF(${bu_net_sales}, 0)
  description: |-
    Other COGS bucket % (freight + product development + obsolescence + compensation) in percent (x100) = 100 * SUM(bu_other_cogs) / BU Net Sales (SUM(net_revenue)). North America: NASE only. Never report for GCP (its revenue nets to about zero).
    Synonyms: other COGS %
- id: bu_cogs_pct
  func_sql: 100 * ${total_bu_cogs} / NULLIF(${bu_net_sales}, 0)
  description: |-
    BU total COGS % in percent (x100) = 100 * SUM(bu_cogs) / BU Net Sales (SUM(net_revenue)). Never report for GCP (its revenue nets to about zero).
    Synonyms: COGS % of net sales, COGS mix
- id: total_bu_adj_ebitda_vs_pfc
  func_sql: ${total_bu_adj_ebitda} - ${total_pfc_bu_adj_ebitda}
  description: |-
    BU Adj. EBITDA change vs the prior forecast ($M) = SUM(bu_adj_ebitda) - SUM(pfc_bu_adj_ebitda).
    Synonyms: BU EBITDA vs PFC, NASE EBITDA change
- id: pfc_bu_ebitda_margin
  func_sql: 100 * ${total_pfc_bu_adj_ebitda} / NULLIF(${total_pfc_net_revenue}, 0)
  description: PFC BU EBITDA margin in percent (x100) = 100 * SUM(pfc_bu_adj_ebitda) / SUM(pfc_net_revenue). Never report
    for GCP.
- id: bu_ebitda_margin_bps_vs_pfc
  func_sql: (${bu_ebitda_margin} - ${pfc_bu_ebitda_margin}) * 100
  description: Change in BU EBITDA margin vs the prior forecast in basis points = (bu_ebitda_margin - pfc_bu_ebitda_margin)
    * 100 (both in percent). Never report for GCP.
- id: net_revenue_vs_pfc
  func_sql: ${total_net_revenue} - ${total_pfc_net_revenue}
  description: |-
    Net revenue change vs the prior forecast (PFC) ($M) = SUM(net_revenue) - SUM(pfc_net_revenue) on the same rows. Only for the cycle immediately before; for a named cycle compare versions by version_label instead. Needs one version and one fiscal_year filter.
