- id: latest_fc_net_revenue
  func: sum
  of: net_revenue
  filters:
  - is_latest_fc
  description: |-
    Net revenue in the latest Monthly Forecast only ($M) = SUM(net_revenue) where is_latest_fc. Safe without a version filter (pinned inside the measure) but still needs a fiscal_year filter.
    Synonyms: latest forecast revenue, current forecast revenue
- id: latest_fc_adj_ebitda
  func: sum
  of: adj_ebitda
  filters:
  - is_latest_fc
  description: |-
    Adj. EBITDA in the latest Monthly Forecast only ($M) = SUM(adj_ebitda) where is_latest_fc. Safe without a version filter (pinned inside the measure) but still needs a fiscal_year filter.
    Synonyms: latest forecast EBITDA, current forecast EBITDA
- id: prior_fc_net_revenue
  func: sum
  of: net_revenue
  filters:
  - is_prior_fc
  description: |-
    Net revenue in the Monthly Forecast immediately before the latest one ($M) = SUM(net_revenue) where is_prior_fc. Safe without a version filter (pinned inside the measure) but still needs a fiscal_year filter.
    Synonyms: prior forecast revenue version
- id: budget_version_net_revenue
  func: sum
  of: net_revenue
  filters:
  - expr_sql: ${version_type} = 'Budget'
  description: |-
    Net revenue from the Budget version rows ($M) = SUM(net_revenue) where version_type = 'Budget' (Plan_<year>). Safe without a version filter (pinned inside the measure) but still needs a fiscal_year filter. Each fiscal year has its own Plan_<year>.
    Synonyms: budget revenue, plan revenue
- id: actual_net_revenue
  func: sum
  of: net_revenue
  filters:
  - expr_sql: ${version_code} = 'Actual'
  description: |-
    Booked actual net revenue ($M) = SUM(net_revenue) where version_code = 'Actual'. Safe without a version filter (pinned inside the measure) but still needs a fiscal_year filter.
    Synonyms: actual revenue, booked revenue
- id: actual_months_net_revenue
  func: sum
  of: net_revenue
  filters:
  - expr_sql: ${af_flag} = 'A'
  description: |-
    Net revenue in months already closed inside the version ($M) = SUM(net_revenue) where af_flag = 'A'. YTD actual within a forecast. Needs one version and one fiscal_year filter.
    Synonyms: YTD actual revenue, actualized revenue, closed-month revenue
- id: forecast_months_net_revenue
  func: sum
  of: net_revenue
  filters:
  - expr_sql: ${af_flag} = 'F'
  description: |-
    Net revenue in months still in forecast ($M) = SUM(net_revenue) where af_flag = 'F'. Year-to-go / remaining revenue. Needs one version and one fiscal_year filter.
    Synonyms: YTG revenue, year-to-go revenue, remaining revenue
- id: forecast_month_count
  func: count_distinct
  of: month_number
  filters:
  - expr_sql: ${af_flag} = 'F'
  description: Number of distinct months still in forecast (af_flag = 'F') in the version. Use for year-to-go monthly run-rate.
- id: actual_months_revenue_pct
  func_sql: 100 * ${actual_months_net_revenue} / NULLIF(${total_net_revenue}, 0)
  description: |-
    Share of the version's net revenue already booked as actual, in percent (x100) = 100 * actual_months_net_revenue / SUM(net_revenue).
    Synonyms: % actualized, percent actual
