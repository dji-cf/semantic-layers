    Synonyms: BU gross profit, NASE gross profit
- id: total_bu_marketing
  func: sum
  of: bu_marketing
  description: |-
    SUM(bu_marketing) ($M). BU-basis marketing ($M). GCP carries none. Use with a bu_page filter (group by bu_detail for NASE vs GCP).
    Synonyms: BU marketing
- id: total_bu_other_sga
  func: sum
  of: bu_other_sga
  description: |-
    SUM(bu_other_sga) ($M). BU-basis SG&A excluding marketing (= other_sga; North America excludes Key Litigation) ($M). Use with a bu_page filter (group by bu_detail for NASE vs GCP).
    Synonyms: BU SG&A, NASE SG&A, GCP SG&A, BU SG&A excl marketing
- id: total_bu_adj_ebitda
  func: sum
  of: bu_adj_ebitda
  description: |-
    SUM(bu_adj_ebitda) ($M). BU-basis Adj. EBITDA, excl. Topps Eliminations ($M). Equals adj_ebitda for segment = bu_page. Use with a bu_page filter (group by bu_detail for NASE vs GCP).
    Synonyms: BU EBITDA, NASE EBITDA, GCP EBITDA
- id: total_pfc_bu_gross_margin
