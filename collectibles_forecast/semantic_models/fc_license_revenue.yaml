name: FC_LICENSE_REVENUE
description: >-
  Fanatics Collectibles revenue by license / league (Global Revenue by License, GRL) for North America,
  International and Digital, by forecast version and month, with the hedge (timing holdback) and unhedged revenue.
  USD millions ($M). Planning-cube basis (CARDPLN_PL_BY_LEAGUE_V): ties to segment revenue in total via an explicit
  'Unallocated (not in license cube)' row; per-license figures land within ~1% of the deck GRL page.
  Only cycles loaded in the league cube appear, so the latest cycle here can lag the segment P&L.

tables:
  - name: fc_license_revenue
    description: >-
      One row per version_code x month x segment (North America / International / Digital) x sub_license.
      Amounts in $M. Always filter to exactly ONE version_code and ONE fiscal_year. Revenue only (no margin).
      Excludes Fanatics Collect, GCP manufacturing and eliminations.
    base_table:
      database: ORACLE_DATA_PROD
      schema: SANDBOX
      table: FC_LICENSE_REVENUE_V

    dimensions:
      - name: version_code
        synonyms: ["version", "scenario", "forecast cycle"]
        description: "Planning version code: '<MON><YY>RF' = Monthly Forecast for that cycle month (e.g. JUN26RF = Jun 2026 FC), 'Plan_<year>' = Budget, 'Actual'."
        expr: VERSION_CODE
        data_type: TEXT
        sample_values: ["SEP26RF", "AUG26RF", "Plan_2026", "Actual"]
      - name: version_label
        description: Display label e.g. 'Jun 2026 FC'. Return it with every version-based figure.
        expr: VERSION_LABEL
        data_type: TEXT
      - name: latest_fc_label
        synonyms: ["latest forecast name"]
        description: Label of the newest Monthly Forecast loaded in the league cube (same value on every row).
        expr: LATEST_FC_LABEL
        data_type: TEXT
      - name: version_type
        description: Actual / Budget / Monthly Forecast.
        expr: VERSION_TYPE
        data_type: TEXT
        is_enum: true
        sample_values: ["Actual", "Budget", "Monthly Forecast"]
      - name: pfc_version_code
        synonyms: ["prior forecast version"]
        description: Cycle immediately before this version among cycles loaded in the league cube (e.g. JUN26RF -> MAY26RF).
        expr: PFC_VERSION_CODE
        data_type: TEXT
      - name: pfc_version_label
        synonyms: ["prior forecast name"]
        description: Display label of pfc_version_code.
        expr: PFC_VERSION_LABEL
        data_type: TEXT
      - name: is_latest_fc
        synonyms: ["latest forecast", "current forecast"]
        description: TRUE for the newest Monthly Forecast loaded in the league cube (may be older than the segment P&L's latest).
        expr: IS_LATEST_FC
        data_type: BOOLEAN
      - name: is_prior_fc
        synonyms: ["prior forecast", "PFC", "previous forecast"]
        description: TRUE for the cycle immediately before is_latest_fc among cycles loaded in the league cube.
        expr: IS_PRIOR_FC
        data_type: BOOLEAN
      - name: fiscal_year
        synonyms: ["FY", "year"]
        description: Fiscal (= calendar) year.
        expr: FISCAL_YEAR
        data_type: NUMBER
      - name: fiscal_quarter
        synonyms: ["quarter"]
        description: Q1-Q4.
        expr: FISCAL_QUARTER
        data_type: TEXT
        is_enum: true
        sample_values: ["Q1", "Q2", "Q3", "Q4"]
      - name: month_number
        synonyms: ["month"]
        description: Month 1-12.
        expr: MONTH_NUMBER
        data_type: NUMBER
      - name: af_flag
        synonyms: ["actual or forecast"]
        description: "'A' closed month, 'F' forecast month, 'Plan' budget."
        expr: AF_FLAG
        data_type: TEXT
        is_enum: true
        sample_values: ["A", "F", "Plan"]
      - name: segment
        synonyms: ["region", "LOB"]
        description: North America (Topps Domestic), International, or Digital.
        expr: SEGMENT
        data_type: TEXT
        is_enum: true
        sample_values: ["North America", "International", "Digital"]
      - name: license
        synonyms: ["league", "sport", "property", "license group", "GRL line"]
        description: >-
          Deck GRL license line. Baseball = MLB; Basketball = NBA; Football = NFL; Total Soccer = UEFA, EPL,
          Club Exclusives, Bundesliga, MLS, UEFA Euro; Total Disney = Disney, Marvel, Star Wars; Total TKO = WWE, UFC.
        expr: LICENSE
        data_type: TEXT
        is_enum: true
        sample_values: ["Baseball", "Basketball", "Football", "Total Soccer", "Total Disney", "Total TKO", "Formula 1",
                        "Sports - Other", "Entertainment - Other", "Tennis", "NIL", "Unallocated (not in license cube)"]
      - name: sub_license
        synonyms: ["sub-license", "licensor"]
        description: Detailed license under the GRL line, e.g. UEFA, EPL, Marvel, Star Wars, WWE, UFC, NBA, NFL.
        expr: SUB_LICENSE
        data_type: TEXT
        sample_values: ["UEFA", "EPL", "Club Exclusives", "Bundesliga", "MLS", "Marvel", "Disney", "Star Wars", "WWE", "UFC", "NBA", "NFL", "Baseball"]
      - name: is_reconciling
        description: TRUE for the 'Unallocated (not in license cube)' row that closes the gap to segment revenue.
        expr: IS_RECONCILING
        data_type: BOOLEAN

    time_dimensions:
      - name: period_date
        description: First day of the month.
        expr: PERIOD_DATE
        data_type: DATE
      - name: cycle_month
        description: Forecast cycle month (orders versions).
        expr: CYCLE_MONTH
        data_type: DATE

    facts:
      - name: net_revenue
        synonyms: ["revenue", "hedged revenue", "sales"]
        description: Net revenue AFTER the hedge holdback ($M) -- the headline (hedged) figure.
        expr: NET_REVENUE
        data_type: NUMBER
      - name: hedge_revenue
        synonyms: ["hedge", "holdback", "timing hedge"]
        description: Hedge holdback included in net_revenue ($M; negative = revenue held back for timing risk).
        expr: HEDGE_REVENUE
        data_type: NUMBER
      - name: unhedged_net_revenue
        synonyms: ["unhedged revenue", "revenue before hedge"]
        description: Net revenue before the hedge = net_revenue - hedge_revenue ($M).
        expr: UNHEDGED_NET_REVENUE
        data_type: NUMBER

    metrics:
      - {name: total_license_revenue, description: "SUM of net_revenue ($M).", expr: SUM(net_revenue)}
      - {name: total_hedge, description: "SUM of hedge_revenue ($M).", expr: SUM(hedge_revenue)}
      - {name: total_unhedged_revenue, description: "SUM of unhedged_net_revenue ($M).", expr: SUM(unhedged_net_revenue)}

verified_queries:
  - name: grl_latest
    question: "What is FY26 revenue by license in the latest forecast?"
    use_as_onboarding_question: true
    sql: |
      SELECT MAX(version_label) AS version_label, license, ROUND(SUM(net_revenue), 2) AS revenue, ROUND(SUM(hedge_revenue), 2) AS hedge,
             ROUND(SUM(unhedged_net_revenue), 2) AS unhedged_revenue
      FROM __fc_license_revenue
      WHERE is_latest_fc = TRUE AND fiscal_year = 2026
      GROUP BY license
      ORDER BY revenue DESC
  - name: intl_hedge
    question: "How much of International revenue is the hedge, by license?"
    sql: |
      SELECT MAX(version_label) AS version_label, license, sub_license, ROUND(SUM(net_revenue), 2) AS revenue, ROUND(SUM(hedge_revenue), 2) AS hedge,
             ROUND(SUM(unhedged_net_revenue), 2) AS unhedged_revenue
      FROM __fc_license_revenue
      WHERE is_latest_fc = TRUE AND fiscal_year = 2026 AND segment = 'International'
      GROUP BY license, sub_license
      HAVING SUM(hedge_revenue) <> 0
      ORDER BY hedge
  - name: digital_mix_by_license
    question: "Which licenses make up Digital revenue and how did they change versus the prior forecast?"
    sql: |
      SELECT license,
             MAX(IFF(is_latest_fc, version_label, NULL)) AS version_label,
             MAX(IFF(is_prior_fc, version_label, NULL)) AS pfc_version_label,
             ROUND(SUM(IFF(is_latest_fc, net_revenue, 0)), 2) AS revenue,
             ROUND(SUM(IFF(is_prior_fc, net_revenue, 0)), 2) AS pfc_revenue,
             ROUND(SUM(IFF(is_latest_fc, net_revenue, 0)) - SUM(IFF(is_prior_fc, net_revenue, 0)), 2) AS revenue_vs_pfc
      FROM __fc_license_revenue
      WHERE (is_latest_fc = TRUE OR is_prior_fc = TRUE) AND fiscal_year = 2026 AND segment = 'Digital'
      GROUP BY license
      ORDER BY revenue_vs_pfc

module_custom_instructions:
  sql_generation: |-
    - Amounts are $M. Always filter to ONE version and ONE fiscal_year (default: is_latest_fc = TRUE and the fiscal year
      of the latest cycle), except in the two-version comparison pattern below.
    - is_latest_fc / is_prior_fc are the newest / second-newest cycles LOADED IN THE LEAGUE CUBE; never assume a month.
      ALWAYS return version_label (and the comparison cycle's label) so the answer can be labelled from the result.
    - There are no pfc columns here. Any two-version comparison (vs prior forecast -> is_prior_fc; vs a named cycle ->
      version_code = '<MON><YY>RF'; vs budget -> version_code = 'Plan_' || fiscal_year) uses conditional aggregation:
      WHERE (is_latest_fc = TRUE OR <other filter>) ... SUM(IFF(is_latest_fc, net_revenue, 0)) - SUM(IFF(<other filter>,
      net_revenue, 0)), grouped by license, with MAX(IFF(.., version_label, NULL)) for each side's label. Never self-join.
    - Headline license revenue is HEDGED (net_revenue). Show unhedged_net_revenue and hedge_revenue when asked about the hedge.
    - Include the 'Unallocated (not in license cube)' row in totals so they tie to segment revenue; mention it when present.
    - 'MLB' = Baseball, 'NBA' = Basketball, 'NFL' = Football, 'soccer' = Total Soccer, 'TKO' = WWE + UFC.
    - ROUNDING: wrap EVERY numeric output column of the FINAL SELECT in ROUND(<expr>, 2) (hundredths), e.g.
      ROUND(SUM(net_revenue), 2); shares / growth rates in percent: ROUND(100 * <ratio>, 2) AS <name>_pct. Round only in
      the final projection -- never inside CTEs, before an aggregate, or in WHERE / HAVING / ORDER BY. Do not round
      fiscal_year or month_number.
  question_categorization: |-
    Revenue by license only. No gross margin, contribution margin or EBITDA by license, no Fanatics Collect, no GMV,
    no FX. Licence figures are planning-cube basis and can differ from the printed deck GRL by ~1%; say so if asked to tie
    to the deck. Older cycles' license splits may not match their deck build -- prefer the latest forecast.
    The league cube can lag the segment P&L by a cycle; if a question needs a cycle that is not loaded here, say so.
